<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المواطن - SmartJudi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Kufi+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-gavel"></i>
                <span>SmartJudi</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="library">
                    <i class="fas fa-book-open"></i>
                    <span>المكتبة القانونية</span>
                </a>
                <a href="#" class="nav-item" data-view="lawyers">
                    <i class="fas fa-user-tie"></i>
                    <span>البحث عن محامي</span>
                </a>
                <a href="#" class="nav-item" data-view="services">
                    <i class="fas fa-concierge-bell"></i>
                    <span>الخدمات العامة</span>
                </a>
                <a href="#" class="nav-item" data-view="profile">
                    <i class="fas fa-user-circle"></i>
                    <span>الملف الشخصي</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="logout-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="ابحث عن قوانين، إجراءات، أو محامين..." id="global-search">
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="theme-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="user-info">
                        <span id="user-name">زائر</span>
                        <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Avatar" class="avatar">
                    </div>
                </div>
            </header>

            <div id="content-area" class="content-area">
                <!-- Views will be injected here -->
                <div class="loader-container" id="main-loader">
                    <div class="loader"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="main.js"></script>
</body>
</html>
