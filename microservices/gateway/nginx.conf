# SmartJudi API Gateway — Nginx Configuration
# Routes all /api/* requests to the correct microservice

upstream auth_upstream      { server auth:8000; }
upstream cases_upstream     { server cases:8000; }
upstream hearings_upstream  { server hearings:8000; }
upstream documents_upstream { server documents:8000; }
upstream legal_upstream     { server legal:8000; }
upstream notif_upstream     { server notifications:8000; }
upstream search_upstream    { server search:8000; }
upstream ai_upstream         { server ai:8000; }
upstream inheritance_upstream { server inheritance:8000; }
upstream portal_upstream      { server portal:80; }

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 25M;

    # ─── Shared headers ───
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # ─── Health endpoint (gateway level) ───
    location = /health/ {
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # ─── Auth Service ───
    location /api/auth/health/ { proxy_pass http://auth_upstream/health/; }
    location /api/token/ {
        proxy_pass http://auth_upstream;
    }
    location /api/register/ {
        proxy_pass http://auth_upstream;
    }
    location /api/create-sub-account/ {
        proxy_pass http://auth_upstream;
    }
    location /api/profiles/ {
        proxy_pass http://auth_upstream;
    }
    location /api/user-sessions/ {
        proxy_pass http://auth_upstream;
    }
    location /api/verify-email/ {
        proxy_pass http://auth_upstream;
    }
    location /api/resend-otp/ {
        proxy_pass http://auth_upstream;
    }
    location /api/password-reset/ {
        proxy_pass http://auth_upstream;
    }

    # ─── Cases Service ───
    location /api/cases/health/ { proxy_pass http://cases_upstream/health/; }
    location /api/cases/ {
        proxy_pass http://cases_upstream;
    }
    location /api/case-parties/ {
        proxy_pass http://cases_upstream;
    }
    location /api/lawsuits/ {
        proxy_pass http://cases_upstream;
    }
    location /api/legal-templates/ {
        proxy_pass http://cases_upstream;
    }
    location /api/financial-claims/ {
        proxy_pass http://cases_upstream;
    }
    location /api/plaintiffs/ {
        proxy_pass http://cases_upstream;
    }
    location /api/defendants/ {
        proxy_pass http://cases_upstream;
    }
    location /api/responses/ {
        proxy_pass http://cases_upstream;
    }
    location /api/appeals/ {
        proxy_pass http://cases_upstream;
    }
    location /api/judgments/ {
        proxy_pass http://cases_upstream;
    }
    location /api/payment-orders/ {
        proxy_pass http://cases_upstream;
    }
    location /api/audit-logs/ {
        proxy_pass http://cases_upstream;
    }
    location /api/case-file-items/ {
        proxy_pass http://cases_upstream;
    }

    # ─── Hearings Service ───
    location /api/hearings/health/ { proxy_pass http://hearings_upstream/health/; }
    location /api/hearings/ {
        proxy_pass http://hearings_upstream;
    }

    # ─── Documents Service ───
    location /api/documents/health/ { proxy_pass http://documents_upstream/health/; }
    location /api/documents/ {
        proxy_pass http://documents_upstream;
    }
    location /api/attachments/ {
        proxy_pass http://documents_upstream;
    }

    # ─── Legal Service ───
    location /api/legal/health/ { proxy_pass http://legal_upstream/health/; }
    location /api/governorates/ {
        proxy_pass http://legal_upstream;
    }
    location /api/districts/ {
        proxy_pass http://legal_upstream;
    }
    location /api/court-types/ {
        proxy_pass http://legal_upstream;
    }
    location /api/court-specializations/ {
        proxy_pass http://legal_upstream;
    }
    location /api/courts/ {
        proxy_pass http://legal_upstream;
    }
    location /api/legal-categories/ {
        proxy_pass http://legal_upstream;
    }
    location /api/laws/ {
        proxy_pass http://legal_upstream;
    }
    location /api/law-chapters/ {
        proxy_pass http://legal_upstream;
    }
    location /api/law-sections/ {
        proxy_pass http://legal_upstream;
    }
    location /api/law-articles/ {
        proxy_pass http://legal_upstream;
    }
    location /api/case-legal-references/ {
        proxy_pass http://legal_upstream;
    }
    location /api/legal-library/ {
        proxy_pass http://legal_upstream;
    }
    location /api/legal-procedures/ {
        proxy_pass http://legal_upstream;
    }
    location /api/law-library-books/ {
        proxy_pass http://legal_upstream;
    }
    location /api/lawyers/ {
        proxy_pass http://legal_upstream;
    }
    location /api/lawyer-filter-options/ {
        proxy_pass http://legal_upstream;
    }

    # ─── Notifications Service ───
    location /api/notifications/health/ { proxy_pass http://notif_upstream/health/; }
    location /api/notifications/ {
        proxy_pass http://notif_upstream;
    }
    location /api/messaging/ {
        proxy_pass http://notif_upstream;
    }

    # ─── Search Service ───
    location /api/search/health/ { proxy_pass http://search_upstream/health/; }
    location /api/search-logs/ {
        proxy_pass http://search_upstream;
    }
    location /api/ai-chat-logs/ {
        proxy_pass http://search_upstream;
    }
    location /api/ai-conversations/ {
        proxy_pass http://search_upstream;
    }

    # ─── Inheritance Service ───
    location /api/inheritance/health/ {
        proxy_pass http://inheritance_upstream/health/;
    }
    location /api/inheritance/ {
        proxy_pass http://inheritance_upstream;
    }

    # ─── AI Service ───
    location /api/ai/health/ {
        proxy_pass http://ai_upstream/health/;
    }
    location /api/ai/ {
        proxy_pass http://ai_upstream;
        proxy_read_timeout 180s;
    }

    # ─── Block internal endpoints from external access ───
    location /internal/ {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json;
    }

    # ─── Unified Admin Dashboard (Centralized Hub) ───
    location /admin/auth/ {
        proxy_pass http://auth_upstream;
    }
    location /admin/cases/ {
        proxy_pass http://cases_upstream;
    }
    location /admin/hearings/ {
        proxy_pass http://hearings_upstream;
    }
    location /admin/documents/ {
        proxy_pass http://documents_upstream;
    }
    location /admin/legal/ {
        proxy_pass http://legal_upstream;
    }
    location /admin/notifications/ {
        proxy_pass http://notif_upstream;
    }
    location /admin/search/ {
        proxy_pass http://search_upstream;
    }
    location /admin/inheritance/ {
        proxy_pass http://inheritance_upstream;
    }
    location /admin/ai/ {
        proxy_pass http://ai_upstream;
    }

    # Default admin redirect to cases
    location = /admin/ {
        return 301 /admin/cases/;
    }

    # ─── Static & Media ───
    location /static/ {
        proxy_pass http://cases_upstream;
    }
    location /media/ {
        proxy_pass http://documents_upstream;
    }

    # ─── Swagger/OpenAPI docs ───
    location /swagger/ {
        proxy_pass http://cases_upstream;
    }
    location /redoc/ {
        proxy_pass http://cases_upstream;
    }

    # ─── Citizen Portal ───
    location /portal/ {
        proxy_pass http://portal_upstream/;
    }

    # ─── Default fallback & Root Redirect ───
    location / {
        return 301 /portal/;
    }
}
