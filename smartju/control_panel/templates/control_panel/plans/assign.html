{% extends "control_panel/base.html" %}

{% block page_header %}
<div class="page-header d-print-none mb-3">
  <div class="row g-2 align-items-center">
    <div class="col">
      <div class="page-pretitle text-secondary">إدارة المستخدمين</div>
      <h2 class="page-title">{{ page_title }}</h2>
    </div>
    <div class="col-auto ms-auto">
      <a href="{% url 'control_panel:user_detail' target_user.pk %}" class="btn btn-outline-secondary"><i class="ti ti-arrow-right me-1"></i> رجوع</a>
    </div>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">
          <i class="ti ti-diamond me-2"></i>
          تعيين خطة اشتراك لـ <strong>{{ target_user.username }}</strong>
        </h3>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">اختر الخطة</label>
            <div class="row g-2">
              {% for p in plans %}
              <div class="col-12">
                <label class="form-selectgroup-item">
                  <input type="radio" name="plan_id" value="{{ p.id }}" class="form-selectgroup-input" required
                    {% if target_user.subscription.plan_id == p.id %}checked{% endif %}>
                  <span class="form-selectgroup-label d-flex align-items-center p-3">
                    {% if p.price == 0 %}
                      <span class="avatar bg-secondary-lt me-3"><i class="ti ti-gift"></i></span>
                    {% elif p.price <= 10 %}
                      <span class="avatar bg-blue-lt me-3"><i class="ti ti-star"></i></span>
                    {% elif p.price <= 30 %}
                      <span class="avatar bg-purple-lt me-3"><i class="ti ti-diamond"></i></span>
                    {% else %}
                      <span class="avatar bg-yellow-lt me-3"><i class="ti ti-crown"></i></span>
                    {% endif %}
                    <div class="flex-fill">
                      <div class="fw-bold">{{ p.name }}</div>
                      <div class="text-secondary small">{{ p.duration_days }} يوم</div>
                    </div>
                    <div class="fw-bold text-primary">${{ p.price }}</div>
                  </span>
                </label>
              </div>
              {% endfor %}
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-3">
            <i class="ti ti-check me-1"></i> تعيين الخطة
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
