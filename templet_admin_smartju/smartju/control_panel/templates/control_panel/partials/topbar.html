{% load static %}
<header class="navbar navbar-expand-md d-print-none cp-topbar">
  <div class="container-xl">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-nav flex-row order-md-last align-items-center">
      <div class="nav-item d-none d-md-flex me-3">
        <div class="btn-list">
          <a href="/" class="btn btn-outline-secondary btn-sm" target="_blank">
            <i class="ti ti-external-link me-1"></i> عرض الموقع
          </a>
        </div>
      </div>

      <div class="nav-item">
        <button id="cp-theme-toggle" class="nav-link px-2 cp-theme-toggle" title="تبديل المظهر">
          <i class="ti ti-sun cp-icon-sun"></i>
          <i class="ti ti-moon cp-icon-moon"></i>
        </button>
      </div>

      <div class="nav-item dropdown">
        <a href="#" class="nav-link d-flex lh-1 text-reset p-0 ms-2" data-bs-toggle="dropdown">
          <span class="avatar avatar-sm cp-avatar">{{ request.user.username|first|upper }}</span>
          <div class="d-none d-xl-block ps-2">
            <div>{{ request.user.get_full_name|default:request.user.username }}</div>
            <div class="mt-1 small text-secondary">
              {% if request.user.is_superuser %}مدير عام{% elif request.user.is_staff %}موظف إداري{% else %}مستخدم{% endif %}
            </div>
          </div>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
          <a href="{% url 'control_panel:profile' %}" class="dropdown-item">
            <i class="ti ti-user me-2"></i> الملف الشخصي
          </a>
          <a href="/admin/password_change/" class="dropdown-item" target="_blank">
            <i class="ti ti-lock me-2"></i> تغيير كلمة المرور
          </a>
          <div class="dropdown-divider"></div>
          <form action="{% url 'control_panel:logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger">
              <i class="ti ti-logout me-2"></i> تسجيل الخروج
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>
