{% extends "control_panel/base.html" %}

{% block content %}
<div class="row row-cards">
  {% for app in grouped %}
    <div class="col-md-6 col-lg-4" id="{{ app.label }}">
      <div class="card h-100 cp-app-card">
        <div class="card-header">
          <div class="cp-app-icon"><i class="ti ti-folder"></i></div>
          <div>
            <h3 class="card-title m-0">{{ app.verbose|default:app.label }}</h3>
            <div class="text-secondary small">{{ app.label }} · {{ app.models|length }} موديلات</div>
          </div>
        </div>
        <div class="list-group list-group-flush">
          {% for m in app.models %}
            <a class="list-group-item list-group-item-action d-flex align-items-center" href="{% url 'control_panel:model_browse' app.label m.name %}">
              <i class="ti ti-table me-2 text-secondary"></i>
              <span class="flex-fill">{{ m.verbose }}</span>
              <span class="badge bg-primary-lt">{{ m.count }}</span>
            </a>
          {% endfor %}
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12"><div class="text-secondary text-center py-5">لا توجد موديلات</div></div>
  {% endfor %}
</div>
{% endblock %}
