{% extends "control_panel/base.html" %}

{% block page_actions %}
  <div class="col-auto">
    <a href="{% url 'control_panel:model_browse' meta.app_label meta.model_name %}" class="btn btn-outline-secondary">
      <i class="ti ti-arrow-right me-1"></i> عودة للقائمة
    </a>
    <form method="post" action="{% url 'control_panel:model_delete' meta.app_label meta.model_name obj.pk %}" class="d-inline" onsubmit="return confirm('حذف هذا السجل؟');">
      {% csrf_token %}
      <button class="btn btn-outline-danger"><i class="ti ti-trash me-1"></i> حذف</button>
    </form>
  </div>
{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">{{ meta.verbose_name|title }} #{{ obj.pk }}</h3>
  </div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <tbody>
        {% for r in rows %}
          <tr>
            <th class="w-25 text-secondary">{{ r.verbose }}</th>
            <td>{{ r.value }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
